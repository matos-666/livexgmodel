name: Sofascore Watchdog

# Runs every 30 minutes (was hourly). Each run does an INTRA-RUN double-check
# (3 health probes spaced 60 s apart) before declaring this run unhealthy —
# this guarantees a strike is only logged when Sofascore is genuinely
# blocked, not on a 30-second hiccup.
#
# Failover trigger:
#   - This run fails AND the previous run also failed → migrate.
#   - Single-run "fast lane": if all 3 intra-run probes fail, this is
#     treated as 2 strikes worth of confidence and triggers IMMEDIATE
#     migration (skips the cross-run cooldown). Cuts max downtime from
#     ~1 h → ~3 min when the block is severe.
#
# Required GitHub Secrets:
#   FLY_API_TOKEN              — fly.io token (get with `flyctl auth token`)
#   TELEGRAM_BOT_TOKEN         — optional, same one the app uses
#   TELEGRAM_ADMIN_CHAT_ID     — optional, your personal Telegram chat ID

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min — at :00 and :30 UTC
  workflow_dispatch:        # manual trigger button (for debugging)
    inputs:
      force_failover:
        description: "Skip the strike check, migrate immediately"
        required: false
        type: boolean
        default: false

permissions:
  contents: write          # needed to push fly.toml change
  actions:  read           # needed to read previous run conclusions

concurrency:
  group: sofascore-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 1. Healthcheck — 3 probes, 60 s apart ───────────────────────────
      # Why 3 probes inside one run instead of just 1:
      #   • A single probe can fail because of a transient TLS hiccup, a
      #     30-second region rate-limit, or a Sofascore API hiccup. Reacting
      #     would migrate unnecessarily — costs Fly compute + churns the
      #     team's running picks for nothing.
      #   • 3 failures spaced ~60 s apart proves the block is sustained,
      #     not a network blip.
      #   • If ANY probe succeeds, this run is healthy and the strike chain
      #     resets. Sofascore region blocks rarely last <2 min, so a single
      #     OK probe in the trio is a strong "we're fine" signal.
      - name: Triple-probe /api/health/sofascore
        id: health
        run: |
          set -e
          probe() {
              curl -fsS --max-time 25 https://livexgmodel-pt.fly.dev/api/health/sofascore \
                  || echo '{"healthy":false,"error":"curl_failed"}'
          }
          jq_healthy() {
              echo "$1" | python3 -c 'import sys,json; print(str(json.load(sys.stdin).get("healthy", False)).lower())'
          }
          jq_field() {
              echo "$1" | python3 -c "import sys,json; print(json.load(sys.stdin).get(\"$2\", -1))"
          }

          echo "── probe 1 ──"
          r1="$(probe)";   h1="$(jq_healthy "$r1")";   echo "raw=$r1"; echo "healthy=$h1"

          if [[ "$h1" == "true" ]]; then
              echo "Probe 1 healthy → run is healthy, no strike"
              echo "healthy=true"      >> "$GITHUB_OUTPUT"
              echo "fast_lane=false"   >> "$GITHUB_OUTPUT"
              echo "passed=1/3"        >> "$GITHUB_STEP_SUMMARY"
              echo "live_games=$(jq_field "$r1" live_games)" >> "$GITHUB_OUTPUT"
              exit 0
          fi

          echo "Probe 1 unhealthy — sleeping 60s then retrying…"
          sleep 60
          echo "── probe 2 ──"
          r2="$(probe)";   h2="$(jq_healthy "$r2")";   echo "raw=$r2"; echo "healthy=$h2"

          if [[ "$h2" == "true" ]]; then
              echo "Probe 2 recovered → run is healthy"
              echo "healthy=true"      >> "$GITHUB_OUTPUT"
              echo "fast_lane=false"   >> "$GITHUB_OUTPUT"
              echo "passed=2/3 (1st flaked, 2nd recovered)" >> "$GITHUB_STEP_SUMMARY"
              echo "live_games=$(jq_field "$r2" live_games)" >> "$GITHUB_OUTPUT"
              exit 0
          fi

          echo "Probe 2 unhealthy — sleeping 60s then final retry…"
          sleep 60
          echo "── probe 3 ──"
          r3="$(probe)";   h3="$(jq_healthy "$r3")";   echo "raw=$r3"; echo "healthy=$h3"

          if [[ "$h3" == "true" ]]; then
              echo "Probe 3 recovered → run is healthy"
              echo "healthy=true"      >> "$GITHUB_OUTPUT"
              echo "fast_lane=false"   >> "$GITHUB_OUTPUT"
              echo "passed=3/3 (1st+2nd flaked, 3rd recovered)" >> "$GITHUB_STEP_SUMMARY"
              echo "live_games=$(jq_field "$r3" live_games)" >> "$GITHUB_OUTPUT"
              exit 0
          fi

          # All 3 probes failed → SUSTAINED block.
          # Trigger the "fast lane": migrate immediately without waiting for
          # the cross-run cooldown. 3 failures over ~2 min is conclusive.
          echo "All 3 probes unhealthy — declaring sustained block (fast lane)"
          echo "healthy=false"     >> "$GITHUB_OUTPUT"
          echo "fast_lane=true"    >> "$GITHUB_OUTPUT"
          echo "live_games=$(jq_field "$r3" live_games)" >> "$GITHUB_OUTPUT"
          {
            echo "## Healthcheck failed (3/3 probes)"
            echo "- probe 1: \`$h1\`"
            echo "- probe 2: \`$h2\`"
            echo "- probe 3: \`$h3\`"
            echo "- live_games (last response): \`$(jq_field "$r3" live_games)\`"
            echo "- last_cycle_age_s: \`$(jq_field "$r3" last_cycle_age_s)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 2. Decide whether to trigger failover ──────────────────────────
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          force="${{ inputs.force_failover }}"
          healthy="${{ steps.health.outputs.healthy }}"
          fast_lane="${{ steps.health.outputs.fast_lane }}"

          if [[ "$force" == "true" ]]; then
              echo "decision=migrate" >> "$GITHUB_OUTPUT"
              echo "reason=manual force_failover=true" >> "$GITHUB_STEP_SUMMARY"
              exit 0
          fi

          if [[ "$healthy" == "true" ]]; then
              echo "decision=skip" >> "$GITHUB_OUTPUT"
              echo "reason=run is healthy" >> "$GITHUB_STEP_SUMMARY"
              exit 0
          fi

          # Fast lane: 3 in-run failures spaced 60s apart is high-confidence
          # — migrate immediately instead of waiting for the next 30-min
          # cron tick. Cuts max downtime to ~3-5 min on severe blocks.
          if [[ "$fast_lane" == "true" ]]; then
              echo "decision=migrate" >> "$GITHUB_OUTPUT"
              echo "reason=fast lane: 3 in-run failures (sustained block confirmed)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
          fi

          # Cross-run check (legacy 2-strike path, kept as belt-and-braces).
          # If we got here, fewer than 3 probes failed in this run but the
          # final state is still 'unhealthy' — could happen if probes 1+2
          # failed and probe 3 succeeded but mark a degraded state somehow.
          # For now this branch is essentially unreachable under the new
          # 'first OK probe wins' logic, but kept as documentation.
          prior_failures="$(
              gh run list \
                --workflow sofascore-watchdog.yml \
                --status completed \
                --limit 1 \
                --json conclusion \
                --jq '[.[] | select(.conclusion == "failure")] | length'
          )"
          if [[ "$prior_failures" -ge 1 ]]; then
              echo "decision=migrate" >> "$GITHUB_OUTPUT"
              echo "reason=2 consecutive failures (cross-run)" >> "$GITHUB_STEP_SUMMARY"
          else
              echo "decision=fail-no-migrate" >> "$GITHUB_OUTPUT"
              echo "reason=first failure; need 1 more before migrating" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── 3a. If unhealthy but no migrate yet — exit 1 to record failure ─
      - name: Mark failure (no migrate yet)
        if: steps.decide.outputs.decision == 'fail-no-migrate'
        run: |
          echo "Unhealthy this run — strike counted, will migrate next failed run"
          exit 1

      # ── 3b. Migrate ────────────────────────────────────────────────────
      - name: Setup flyctl
        if: steps.decide.outputs.decision == 'migrate'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Run auto_failover.sh
        if: steps.decide.outputs.decision == 'migrate'
        env:
          FLY_API_TOKEN:          ${{ secrets.FLY_API_TOKEN }}
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          APP_NAME:               livexgmodel-pt
        run: |
          bash tools/auto_failover.sh

      # ── 4. On any failure, notify via Telegram ─────────────────────────
      - name: Telegram alert on failover failure
        if: failure() && steps.decide.outputs.decision == 'migrate'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          if [[ -z "$TG_TOKEN" || -z "$TG_CHAT" ]]; then exit 0; fi
          msg="🔴 *Sofascore auto-failover FAILED*%0A%0AAll candidate regions blocked or migration script errored. Manual intervention needed.%0A%0ARun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d "chat_id=${TG_CHAT}" \
              -d "text=$msg" \
              -d "parse_mode=Markdown" >/dev/null || true
