; Supervisor config for the livexgmodel-pt Fly.io container.
; Runs two long-lived processes side by side:
;   1) gunicorn — serves the Flask app (port 8080, public via Fly proxy)
;   2) flaresolverr — Cloudflare bypass proxy (port 8191, loopback only)
;
; If either process dies, supervisord restarts it. If supervisord itself dies,
; Fly.io restarts the whole machine. Logs from both processes go to stdout/stderr
; so they appear together in `flyctl logs`.

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
user=root

[program:gunicorn]
command=gunicorn server:app --bind 0.0.0.0:%(ENV_PORT)s --worker-class gevent --workers 2 --worker-connections 1000 --timeout 120 --keep-alive 75 --graceful-timeout 30
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:flaresolverr]
command=python -u /opt/flaresolverr/src/flaresolverr.py
directory=/opt/flaresolverr
autostart=true
autorestart=true
startsecs=10
startretries=5
stopwaitsecs=15
environment=PORT="8191",HOST="127.0.0.1",LOG_LEVEL="info",HEADLESS="true",CAPTCHA_SOLVER="none",BROWSER_TIMEOUT="40000",TEST_URL="https://www.google.com"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10
